[package]
name = "napcat_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# Web Framework
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Client (LLM)
reqwest = { version = "0.11", features = ["json"] }

# Embeddings (Local)
fastembed = "5.9.0"

# Database
# Added "json" feature for JSONB support
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
# CRITICAL: Helper to map Rust Vec<f32> to Postgres vector
pgvector = { version = "0.3", features = ["sqlx"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dotenvy = "0.15"
futures = "0.3"
toml = "0.8"

# WebSocket Client for NapCat
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# XML parsing for forward messages
quick-xml = "0.31"

# Regular expressions for message cleaning
regex = "1.10"

# Audio processing
hound = "3.5"
async-trait = "0.1"

# Configuration
serde_yaml = "0.9"

# Additional dependencies for Open-LLM-VTuber interfaces
config = "0.13"
log = "0.4"
env_logger = "0.10"

[lib]
name = "napcat_backend"
path = "src/lib.rs"

[[bin]]
name = "unified_launcher"
path = "src/bin/unified_launcher.rs"

[[bin]]
name = "napcat_backend"
path = "src/main.rs"
